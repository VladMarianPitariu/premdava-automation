---
- name: Read monitoring status from Prometheus
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    grafana_url: "{{ lookup('ansible.builtin.env', 'GRAFANA_URL') | default('', true) }}"
    grafana_token: "{{ lookup('ansible.builtin.env', 'GRAFANA_TOKEN') | default('', true) }}"
    prometheus_datasource_uid: "{{ lookup('ansible.builtin.env', 'GRAFANA_PROMETHEUS_DS_UID') | default('ffidfenffgyyoe', true) }}"
    report_only: true
    endpoint_query: 'probe_success{job=~"blackbox_internal_endpoints|blackbox_icmp_hosts"}'
    host_query: 'up{job=~"windows_exporter|node_exporter"}'
  tasks:
    - name: Require Grafana API settings
      ansible.builtin.assert:
        that:
          - grafana_url | length > 0
          - grafana_token | length > 0
        fail_msg: >-
          Set GRAFANA_URL and GRAFANA_TOKEN as Semaphore environment variables.

    - name: Query endpoint status
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/datasources/proxy/uid/{{ prometheus_datasource_uid }}/api/v1/query?query={{ endpoint_query | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ grafana_token }}"
        return_content: true
        status_code: 200
        validate_certs: true
        no_log: true
      register: endpoint_status

    - name: Query host status
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/datasources/proxy/uid/{{ prometheus_datasource_uid }}/api/v1/query?query={{ host_query | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ grafana_token }}"
        return_content: true
        status_code: 200
        validate_certs: true
        no_log: true
      register: host_status

    - name: Report endpoint and host status
      ansible.builtin.debug:
        msg:
          report_only: "{{ report_only }}"
          endpoint_results: "{{ endpoint_status.json.data.result | default([]) }}"
          host_results: "{{ host_status.json.data.result | default([]) }}"
